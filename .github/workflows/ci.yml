name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Lint
        run: make lint
      - name: Test
        run: make test
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
      - name: Build image (fake model)
        run: |
          uv run --no-project --with-requirements app/requirements.txt --with-requirements tests/requirements.txt \
            python tests/fakes.py app/model
          docker build -t digit-app:ci .
