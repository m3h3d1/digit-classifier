<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digit Classifier</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f4f5; color: #18181b; margin: 0; padding: 16px; }
  main { max-width: 320px; margin: 0 auto; }
  canvas { background: #000; border-radius: 8px; touch-action: none; width: 100%; aspect-ratio: 1; }
  .buttons { display: flex; gap: 8px; margin: 12px 0; }
  button { flex: 1; padding: 10px; font-size: 16px; border: 0; border-radius: 6px; cursor: pointer; }
  #predict { background: #2563eb; color: #fff; }
  #clear { background: #e4e4e7; }
  li { font-size: 18px; margin: 4px 0; }
  .muted { color: #71717a; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Draw a character</h1>
  <canvas id="pad" width="280" height="280"></canvas>
  <div class="buttons"><button id="clear">Clear</button><button id="predict">Predict</button></div>
  <ol id="top"></ol>
  <p class="muted" id="model"></p>
</main>
<script>
const pad = document.getElementById("pad"), ctx = pad.getContext("2d");
const clear = () => { ctx.fillStyle = "#000"; ctx.fillRect(0, 0, 280, 280); document.getElementById("top").innerHTML = ""; };
clear();
ctx.strokeStyle = "#fff"; ctx.lineWidth = 20; ctx.lineCap = ctx.lineJoin = "round";

let drawing = false;
const pos = e => { const r = pad.getBoundingClientRect(); return [(e.clientX - r.left) * 280 / r.width, (e.clientY - r.top) * 280 / r.height]; };
pad.onpointerdown = e => { drawing = true; ctx.beginPath(); ctx.moveTo(...pos(e)); };
pad.onpointermove = e => { if (drawing) { ctx.lineTo(...pos(e)); ctx.stroke(); } };
pad.onpointerup = pad.onpointerleave = () => { drawing = false; };

document.getElementById("clear").onclick = clear;
document.getElementById("predict").onclick = async () => {
  const res = await fetch("/predict", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ image: pad.toDataURL("image/png") }) });
  const { top } = await res.json();
  document.getElementById("top").innerHTML = top.length
    ? top.map(t => `<li><b>${t.label}</b> — ${(t.prob * 100).toFixed(1)}%</li>`).join("")
    : "<li>Draw something first</li>";
};

fetch("/health").then(r => r.json()).then(h => {
  document.getElementById("model").textContent =
    `Model v${h.version} · ${h.run} · test accuracy ${(h.test_accuracy * 100).toFixed(2)}%`;
});
</script>
</body>
</html>
